name: Build and Deploy Application

on:
  push:
    branches:
      - main
      - practical
    paths-ignore:
      - 'infra/**'
      - '*.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_RESOURCE_GROUP: aguadamillas_students_1
  IMAGE_NAME: flask-app

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      imageTag: ${{ steps.meta.outputs.tags }}
      imageDigest: ${{ steps.build.outputs.digest }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Azure CLI
        uses: azure/setup-cli@v1
        with:
          azcli-version: 2.53.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container Registry details
        id: acr
        run: |
          # Find the container registry in the resource group
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
          ACR_LOGIN_SERVER=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].loginServer' -o tsv)
          
          if [ -z "$ACR_NAME" ]; then
            echo "❌ No Container Registry found in resource group ${{ env.AZURE_RESOURCE_GROUP }}"
            echo "Please run the infrastructure deployment first"
            exit 1
          fi
          
          echo "acrName=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acrLoginServer=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "✅ Found Container Registry: $ACR_NAME"

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.acrLoginServer }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.acrLoginServer }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate build summary
        run: |
          echo "### 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ steps.acr.outputs.acrLoginServer }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | ${{ steps.build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/practical' || github.event_name == 'workflow_dispatch'
    
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Setup Azure CLI
        uses: azure/setup-cli@v1
        with:
          azcli-version: 2.53.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Web App details
        id: webapp
        run: |
          # Find the web app in the resource group
          WEB_APP_NAME=$(az webapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
          
          if [ -z "$WEB_APP_NAME" ]; then
            echo "❌ No Web App found in resource group ${{ env.AZURE_RESOURCE_GROUP }}"
            echo "Please run the infrastructure deployment first"
            exit 1
          fi
          
          WEB_APP_URL=$(az webapp show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $WEB_APP_NAME --query 'defaultHostName' -o tsv)
          
          echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "webAppUrl=https://$WEB_APP_URL" >> $GITHUB_OUTPUT
          echo "✅ Found Web App: $WEB_APP_NAME"

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.webapp.outputs.webAppName }}
          images: ${{ needs.build.outputs.imageTag }}

      - name: Test deployment
        run: |
          WEB_APP_URL="${{ steps.webapp.outputs.webAppUrl }}"
          echo "Testing deployment at: $WEB_APP_URL"
          
          # Wait for the deployment to be ready
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Test the health endpoint
          for i in {1..10}; do
            if curl -f -s "$WEB_APP_URL" > /dev/null; then
              echo "✅ Deployment successful! Application is responding"
              echo "webapp-url=$WEB_APP_URL" >> $GITHUB_OUTPUT
              break
            else
              echo "⏳ Attempt $i/10: Application not ready yet, waiting..."
              sleep 15
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ Application is not responding after 10 attempts"
              exit 1
            fi
          done

      - name: Generate deployment summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web App | ${{ steps.webapp.outputs.webAppName }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | [${{ steps.webapp.outputs.webAppUrl }}](${{ steps.webapp.outputs.webAppUrl }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ needs.build.outputs.imageTag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Your Flask application is now live!**" >> $GITHUB_STEP_SUMMARY 