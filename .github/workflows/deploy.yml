name: Deploy Flask Application

on:
  push:
    branches:
      - main
      - practical
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_infra:
        description: 'Skip infrastructure deployment'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: aguadamillas_students_1
  AZURE_LOCATION: eastus
  IMAGE_NAME: flask-app

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_infra != 'true'
    
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}-infra

    outputs:
      resourceGroupName: ${{ steps.deploy.outputs.resourceGroupName }}
      containerRegistryName: ${{ steps.deploy.outputs.containerRegistryName }}
      containerRegistryEndpoint: ${{ steps.deploy.outputs.containerRegistryEndpoint }}
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      webAppUrl: ${{ steps.deploy.outputs.webAppUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate BICEP template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment sub validate \
              --location ${{ env.AZURE_LOCATION }} \
              --template-file ./infra/main.bicep \
              --parameters ./infra/main.parameters.json \
              --parameters environmentName=dev-${{ github.run_number }} \
              --parameters location=${{ env.AZURE_LOCATION }}

      - name: Deploy BICEP template
        id: deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            ENV_NAME="${{ github.event.inputs.environment || 'dev' }}-${{ github.run_number }}"
            
            echo "Deploying infrastructure to resource group: ${{ env.AZURE_RESOURCE_GROUP }}"
            echo "Environment name: $ENV_NAME"
            
            # Deploy the infrastructure
            DEPLOYMENT_OUTPUT=$(az deployment sub create \
              --location ${{ env.AZURE_LOCATION }} \
              --template-file ./infra/main.bicep \
              --parameters ./infra/main.parameters.json \
              --parameters environmentName=$ENV_NAME \
              --parameters location=${{ env.AZURE_LOCATION }} \
              --output json)
            
            echo "Deployment completed successfully"
            
            # Extract outputs
            RESOURCE_GROUP_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_RESOURCE_GROUP.value')
            CONTAINER_REGISTRY_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_CONTAINER_REGISTRY_NAME.value')
            CONTAINER_REGISTRY_ENDPOINT=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_CONTAINER_REGISTRY_ENDPOINT.value')
            WEB_APP_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_WEB_APP_NAME.value')
            WEB_APP_URL=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_WEB_APP_URI.value')
            
            # Set outputs
            echo "resourceGroupName=$RESOURCE_GROUP_NAME" >> $GITHUB_OUTPUT
            echo "containerRegistryName=$CONTAINER_REGISTRY_NAME" >> $GITHUB_OUTPUT
            echo "containerRegistryEndpoint=$CONTAINER_REGISTRY_ENDPOINT" >> $GITHUB_OUTPUT
            echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT
            echo "webAppUrl=$WEB_APP_URL" >> $GITHUB_OUTPUT
            
            echo "### 🚀 Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Resource | Name | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Resource Group | $RESOURCE_GROUP_NAME | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| Container Registry | $CONTAINER_REGISTRY_NAME | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| Web App | $WEB_APP_NAME | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| Web App URL | [$WEB_APP_URL]($WEB_APP_URL) | 🌐 |" >> $GITHUB_STEP_SUMMARY

      - name: Verify deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Verifying deployed resources..."
            
            # Check if resource group exists
            az group show --name ${{ steps.deploy.outputs.resourceGroupName }} --output table
            
            # List deployed resources
            echo "Resources in the resource group:"
            az resource list --resource-group ${{ steps.deploy.outputs.resourceGroupName }} --output table

  build-and-deploy:
    name: Build and Deploy Application
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: always() && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.deploy-app.outputs.webapp-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure resources
        id: azure-resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Find the container registry in the resource group
            ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
            ACR_LOGIN_SERVER=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].loginServer' -o tsv)
            
            if [ -z "$ACR_NAME" ]; then
              echo "❌ No Container Registry found in resource group ${{ env.AZURE_RESOURCE_GROUP }}"
              echo "Please run the infrastructure deployment first"
              exit 1
            fi
            
            # Find the web app in the resource group
            WEB_APP_NAME=$(az webapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
            
            if [ -z "$WEB_APP_NAME" ]; then
              echo "❌ No Web App found in resource group ${{ env.AZURE_RESOURCE_GROUP }}"
              echo "Please run the infrastructure deployment first"
              exit 1
            fi
            
            WEB_APP_URL=$(az webapp show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $WEB_APP_NAME --query 'defaultHostName' -o tsv)
            
            echo "acrName=$ACR_NAME" >> $GITHUB_OUTPUT
            echo "acrLoginServer=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
            echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT
            echo "webAppUrl=https://$WEB_APP_URL" >> $GITHUB_OUTPUT
            
            echo "✅ Found Container Registry: $ACR_NAME"
            echo "✅ Found Web App: $WEB_APP_NAME"

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.azure-resources.outputs.acrLoginServer }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.azure-resources.outputs.acrLoginServer }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Deploy to Azure Web App
        id: deploy-app
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.azure-resources.outputs.webAppName }}
          images: ${{ steps.meta.outputs.tags }}

      - name: Test deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            WEB_APP_URL="${{ steps.azure-resources.outputs.webAppUrl }}"
            echo "Testing deployment at: $WEB_APP_URL"
            
            # Wait for the deployment to be ready
            echo "Waiting for deployment to be ready..."
            sleep 30
            
            # Test the health endpoint
            for i in {1..10}; do
              if curl -f -s "$WEB_APP_URL" > /dev/null; then
                echo "✅ Deployment successful! Application is responding"
                echo "webapp-url=$WEB_APP_URL" >> $GITHUB_OUTPUT
                break
              else
                echo "⏳ Attempt $i/10: Application not ready yet, waiting..."
                sleep 15
              fi
              
              if [ $i -eq 10 ]; then
                echo "❌ Application is not responding after 10 attempts"
                exit 1
              fi
            done

      - name: Generate deployment summary
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "### 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Web App | ${{ steps.azure-resources.outputs.webAppName }} |" >> $GITHUB_STEP_SUMMARY
            echo "| URL | [${{ steps.azure-resources.outputs.webAppUrl }}](${{ steps.azure-resources.outputs.webAppUrl }}) |" >> $GITHUB_STEP_SUMMARY
            echo "| Image | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Your Flask application is now live!**" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup on Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-deploy]
    if: failure() && github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Manual cleanup instructions
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "### ⚠️ Deployment Failed - Cleanup Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The deployment failed. You may need to manually clean up resources." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To clean up the resource group, run:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "az group delete --name ${{ env.AZURE_RESOURCE_GROUP }} --yes --no-wait" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY 