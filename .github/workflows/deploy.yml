name: Build and Deploy Bicep Template and Docker Image

env:
  RESOURCE_GROUP: aguadamillas_students_1
  REGISTRY_NAME: ''  # Will be set dynamically after infrastructure deployment
  IMAGE_NAME: flask-app
  AZURE_LOCATION: eastus

on:
  push:
    branches:
      - main
      - practical
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_infra:
        description: 'Skip infrastructure deployment'
        required: false
        default: false
        type: boolean

jobs:
  # Job to build the Bicep template
  build-bicep:
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_infra != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            az version

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Bicep Template
        run: |
          # Validate the Bicep template
          az bicep build --file ./infra/main.bicep
          echo "✅ Bicep template validation successful"

  # Job to deploy the Bicep template
  deploy-bicep:
    runs-on: ubuntu-latest
    needs: build-bicep
    if: github.event.inputs.skip_infra != 'true'
    outputs:
      registryName: ${{ steps.deploy.outputs.registryName }}
      registryLoginServer: ${{ steps.deploy.outputs.registryLoginServer }}
      webAppName: ${{ steps.deploy.outputs.webAppName }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep Template
        id: deploy
        run: |
          ENV_NAME="${{ github.event.inputs.environment || 'dev' }}-${{ github.run_number }}"
          
          echo "Deploying infrastructure..."
          DEPLOYMENT_OUTPUT=$(az deployment sub create \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file ./infra/main.bicep \
            --parameters ./infra/main.parameters.json \
            --parameters environmentName=$ENV_NAME \
            --parameters location=${{ env.AZURE_LOCATION }} \
            --output json)
          
          # Extract outputs
          REGISTRY_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_CONTAINER_REGISTRY_NAME.value')
          REGISTRY_LOGIN_SERVER=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_CONTAINER_REGISTRY_ENDPOINT.value')
          WEB_APP_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.properties.outputs.AZURE_WEB_APP_NAME.value')
          
          echo "registryName=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registryLoginServer=$REGISTRY_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT
          
          echo "✅ Infrastructure deployment completed"
          echo "📝 Container Registry: $REGISTRY_NAME"
          echo "📝 Web App: $WEB_APP_NAME"

  # Job to build and push Docker image
  build-docker:
    runs-on: ubuntu-latest
    needs: [deploy-bicep]
    if: always() && (needs.deploy-bicep.result == 'success' || needs.deploy-bicep.result == 'skipped')
    outputs:
      imageTag: ${{ steps.image-info.outputs.imageTag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Container Registry info
        id: registry-info
        run: |
          # Find the container registry in the resource group
          if [ "${{ needs.deploy-bicep.result }}" = "success" ]; then
            REGISTRY_NAME="${{ needs.deploy-bicep.outputs.registryName }}"
            REGISTRY_LOGIN_SERVER="${{ needs.deploy-bicep.outputs.registryLoginServer }}"
          else
            # If infrastructure was skipped, find existing registry
            REGISTRY_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} --query '[0].name' -o tsv)
            REGISTRY_LOGIN_SERVER=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} --query '[0].loginServer' -o tsv)
          fi
          
          if [ -z "$REGISTRY_NAME" ]; then
            echo "❌ No Container Registry found in resource group ${{ env.RESOURCE_GROUP }}"
            exit 1
          fi
          
          echo "registryName=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registryLoginServer=$REGISTRY_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "✅ Found Container Registry: $REGISTRY_NAME"

      - name: Get ACR Credentials
        id: acr-credentials
        run: |
          REGISTRY_NAME="${{ steps.registry-info.outputs.registryName }}"
          ACR_USERNAME=$(az acr credential show --name $REGISTRY_NAME --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $REGISTRY_NAME --query "passwords[0].value" -o tsv)
          echo "acrUsername=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acrPassword=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry-info.outputs.registryLoginServer }}
          username: ${{ steps.acr-credentials.outputs.acrUsername }}
          password: ${{ steps.acr-credentials.outputs.acrPassword }}

      - name: Set Image Version and Tag
        id: image-info
        run: |
          IMAGE_VERSION=$(date +'%Y.%m.%d.%H.%M')
          IMAGE_TAG="${{ steps.registry-info.outputs.registryLoginServer }}/${{ env.IMAGE_NAME }}:$IMAGE_VERSION"
          LATEST_TAG="${{ steps.registry-info.outputs.registryLoginServer }}/${{ env.IMAGE_NAME }}:latest"
          
          echo "imageVersion=$IMAGE_VERSION" >> $GITHUB_OUTPUT
          echo "imageTag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "latestTag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          echo "🏷️ Image Version: $IMAGE_VERSION"
          echo "🏷️ Image Tag: $IMAGE_TAG"

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image-info.outputs.imageTag }}
            ${{ steps.image-info.outputs.latestTag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build Summary
        run: |
          echo "### 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ steps.registry-info.outputs.registryLoginServer }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.image-info.outputs.imageVersion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.image-info.outputs.imageTag }} |" >> $GITHUB_STEP_SUMMARY

  # Job to deploy Docker image to Azure Web App
  deploy-docker:
    runs-on: ubuntu-latest
    needs: [deploy-bicep, build-docker]
    if: always() && needs.build-docker.result == 'success'

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Web App info
        id: webapp-info
        run: |
          if [ "${{ needs.deploy-bicep.result }}" = "success" ]; then
            WEB_APP_NAME="${{ needs.deploy-bicep.outputs.webAppName }}"
          else
            # If infrastructure was skipped, find existing web app
            WEB_APP_NAME=$(az webapp list --resource-group ${{ env.RESOURCE_GROUP }} --query '[0].name' -o tsv)
          fi
          
          if [ -z "$WEB_APP_NAME" ]; then
            echo "❌ No Web App found in resource group ${{ env.RESOURCE_GROUP }}"
            exit 1
          fi
          
          echo "webAppName=$WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "✅ Found Web App: $WEB_APP_NAME"

      - name: Deploy Docker Image to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.webapp-info.outputs.webAppName }}
          images: ${{ needs.build-docker.outputs.imageTag }}

      - name: Test deployment
        run: |
          WEB_APP_NAME="${{ steps.webapp-info.outputs.webAppName }}"
          WEB_APP_URL="https://$WEB_APP_NAME.azurewebsites.net"
          
          echo "Testing deployment at: $WEB_APP_URL"
          
          # Wait for the deployment to be ready
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Test the health endpoint
          for i in {1..10}; do
            if curl -f -s "$WEB_APP_URL" > /dev/null; then
              echo "✅ Deployment successful! Application is responding"
              echo "🌐 App URL: $WEB_APP_URL"
              break
            else
              echo "⏳ Attempt $i/10: Application not ready yet, waiting..."
              sleep 15
            fi
            
            if [ i -eq 10 ]; then
              echo "❌ Application is not responding after 10 attempts"
              exit 1
            fi
          done

      - name: Deployment Summary
        run: |
          WEB_APP_NAME="${{ steps.webapp-info.outputs.webAppName }}"
          WEB_APP_URL="https://$WEB_APP_NAME.azurewebsites.net"
          
          echo "### 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web App | $WEB_APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | [$WEB_APP_URL]($WEB_APP_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ needs.build-docker.outputs.imageTag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Your Flask application is now live!**" >> $GITHUB_STEP_SUMMARY 